[project]
name = "sciencebeam-utils"
version = "0.0.0"
description = "ScienceBeam Utils"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "backports-csv>=1.0",
    "backports-tempfile>=1.0",
    "lxml>=4.2.0",
    "numpy>=1.14.2",
    "six>=1.11.0",
    "tqdm>=4.0.0",
]

[project.optional-dependencies]
beam = [
    "apache-beam[gcp]>=2.34.0",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "nose>=1.3.7",
    "pylint>=3.3.9",
    "pytest>=6.2.5",
    "pytest-watch>=4.2.0",
]
